# Aplicacoes estaticas do PLI publicadas no GitHub Pages.
# Este snippet e incluido no server HTTPS principal do SIGMA.

location = /sigma-apps/infosiga {
    return 301 /sigma-apps/infosiga/;
}
location ^~ /sigma-apps/infosiga/ {
    proxy_ssl_server_name on;
    proxy_set_header Host vpcapanema.github.io;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sigma-apps/infosiga;
    proxy_pass https://vpcapanema.github.io/acidentes_infosiga_analise_exploratoria/;
    proxy_redirect https://vpcapanema.github.io/acidentes_infosiga_analise_exploratoria/ /sigma-apps/infosiga/;
}

